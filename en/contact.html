<body data-page="contact">
<section class="sub-hero"><div class="sub-bg" style="background-image:url('assets/img/hk.webp')"></div><div class="container"><div class="crumb"><a href="en/index.html">HOME</a>/<span>Contact</span></div><span class="eyebrow">Contact</span><h1>Quotation · Technical Inquiry</h1><p>Leave your inquiry and our engineers will reply promptly.</p></div></section>
<main id="main"><section class="sec"><div class="container contact-wrap"><aside class="contact-card" id="contact-card"></aside>
<form id="inq-form" novalidate><div class="form-grid">
<div class="field"><label for="f-type">Inquiry type<span class="req">*</span></label><select id="f-type" name="type" data-req></select></div>
<div class="field"><label for="f-product">Product of interest</label><select id="f-product" name="product"></select></div>
<div class="field"><label for="f-company">Company<span class="req">*</span></label><input id="f-company" name="company" autocomplete="organization" data-req><span class="err">Please enter your company name</span></div>
<div class="field"><label for="f-name">Your name<span class="req">*</span></label><input id="f-name" name="name" autocomplete="name" data-req><span class="err">Please enter your name</span></div>
<div class="field"><label for="f-phone">Phone<span class="req">*</span></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" placeholder="+1 555 123 4567" data-req><span class="err">Please enter a valid phone number</span></div>
<div class="field"><label for="f-email">Email<span class="req">*</span></label><input id="f-email" name="email" type="email" autocomplete="email" data-req><span class="err">Please enter a valid email</span></div>
<div class="field full"><label for="f-qty">Expected quantity / lead time</label><input id="f-qty" name="qty" placeholder="e.g. 50 pcs / January 2027"></div>
<div class="field full"><label for="f-msg">Message<span class="req">*</span></label><textarea id="f-msg" name="message" data-req placeholder="Operating conditions (temperature, pressure, medium), required specifications and certification needs help us answer accurately."></textarea><span class="err">Please enter your message</span></div>
<input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
<label class="agree field full"><input type="checkbox" name="agree" data-req><span><b style="color:var(--text)">[Required] Consent to collection and use of personal information</b><br>Items: company, name, phone, email / Purpose: responding to inquiries and quotations / Retention: 3 years after handling. <a href="en/privacy.html" target="_blank" style="text-decoration:underline">Read policy</a></span></label>
<div class="full" style="grid-column:1/-1"><button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;height:58px;font-size:16px">Submit inquiry</button></div>
</div></form></div></section>
<section class="sec-sm" style="padding-top:0"><div class="container"><div class="map" id="map"></div></div></section></main>
<script src="data/site-data.js"></script>
<script src="data/site-data-en.js"></script>
<script src="js/app.js"></script>
</body>
