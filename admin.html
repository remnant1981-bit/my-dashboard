<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SMG 관리자</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="login" class="login">
  <form class="login-box" id="login-form">
    <div class="lg"><span class="logo-mark">SMG</span><b>관리자 로그인</b></div>
    <label>비밀번호<input type="password" id="pw" autocomplete="current-password" autofocus required></label>
    <button class="b b-pri" style="width:100%">로그인</button>
    <p class="hint">초기 비밀번호: <code>smg1234!</code> — 로그인 후 [설정]에서 반드시 변경하세요.</p>
    <a href="index.html" class="hint">← 홈페이지로</a>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <a class="brand" href="index.html" target="_blank"><span class="logo-mark">SMG</span><span>CMS</span></a>
    <nav id="menu"></nav>
    <div class="side-foot"><button class="b b-ghost" id="logout">로그아웃</button></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="b b-ghost menu-btn" id="menu-btn" aria-label="메뉴">☰</button>
      <h1 id="page-title">대시보드</h1>
      <span id="save-state" class="save-state">저장됨</span>
      <div class="lang-tg" id="lang-tg" title="편집 언어"></div>
      <div class="top-act">
        <button class="b b-line" id="btn-preview">미리보기</button>
        <button class="b b-pri" id="btn-publish">게시하기</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="data/site-data.js"></script>
<script src="data/site-data-en.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
