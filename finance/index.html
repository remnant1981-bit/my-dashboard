<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>금융 관리</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="finance.css?v=f60fbeb0">
</head>
<body>
<header class="top">
  <h1>금융 관리 <small>대출 · 고정지출</small></h1>
  <div class="act">
    <button class="b b-line" id="btn-mask" title="금액 숨기기">👁 금액 숨김</button>
    <button class="b b-pri" id="btn-add-loan">+ 대출 추가</button>
  </div>
</header>
<main>
  <section id="summary" class="cards"></section>
  <section class="panel"><h2>향후 12개월 월별 지출 예상</h2><div id="forecast"></div></section>
  <section class="panel"><h2>대출 <span class="cnt" id="loan-cnt"></span></h2><div id="loans"></div></section>
  <section class="panel">
    <h2>고정지출 <button class="b b-line b-sm" id="btn-add-exp">+ 추가</button></h2>
    <div id="exps"></div>
  </section>
  <section class="panel">
    <h2>데이터 · 백업</h2>
    <p class="hint">입력한 내용은 <b>이 브라우저(localStorage)에만</b> 저장되며 서버·저장소로 전송되지 않음. 브라우저 데이터 삭제·기기 변경 시 사라지므로 주기적으로 백업 필요.</p>
    <div class="row">
      <button class="b b-line" id="btn-export">백업 내려받기(JSON)</button>
      <label class="b b-line">백업 불러오기<input type="file" id="file-import" accept="application/json" hidden></label>
      <button class="b b-line" id="btn-sample">예시 데이터 넣기</button>
      <button class="b b-del" id="btn-reset">전체 삭제</button>
    </div>
    <p class="hint">※ 이자는 월 단위(연이율÷12) 단순 계산이며 금융기관의 일할계산·반올림 방식과 수백~수천 원 차이 날 수 있음. 변동금리는 금리 변경 시 대출 정보를 수정하여 사용.</p>
  </section>
</main>
<dialog id="dlg"></dialog>
<script src="finance.js?v=24befc26"></script>
</body>
</html>
